<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Artists | Groupie Tracker</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header" style="display: flex; justify-content: space-between; align-items: center; padding: 1rem; color: white;">
  <h1 class="main-title" style="margin: 0;">Groupie Tracker</h1>
  <nav class="nav-centered">
    <ul class="nax-list" style="list-style: none; display: flex; gap: 1rem; margin: 0; padding: 0;">
      <li><a href="/" style="color: white; text-decoration: none;">Home</a></li>
      <li><a href="/aboutus" style="color: white; text-decoration: none;">About Us</a></li>
    </ul>
  </nav>
</header>
 
 
  <main class="container artists-grid">
    {{ range .Artists }}
      <article class="artist-card">
        <a href="/submit?value={{ .ID }}">
          <div class="artist-img-wrapper">
            <img src="{{ .Image }}" alt="{{ .Name }}" class="{{if eq .ID 21}}blurred-img{{end}}">
          </div>
          <h2 class="artist-name">{{ .Name }}</h2>
        </a>
      </article>
    {{ end }}
  </main>
 
  <footer class="site-footer">
    <p>&copy; 2025 Groupie Tracker &mdash; Crafted with passion</p>
  </footer>
</body>
</html>
