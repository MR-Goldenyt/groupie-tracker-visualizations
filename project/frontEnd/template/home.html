<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Artists | Groupie Tracker</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header">
  <h1 class="main-title unselectable" style="margin: 0;">Groupie Tracker</h1>
  <nav class="nav-centered">
    <ul class="nav-list" style="list-style: none; display: flex; gap: 1rem; margin: 0; padding: 0;">
      <li><a class="unselectable" href="/">Home</a></li>
      <li><a class="unselectable" href="/aboutus">About Us</a></li>
    </ul>
  </nav>
</header>
 
 
  <main class="container artists-grid">
    {{ range .Artists }}
      <article class="artist-card unselectable">
        <a href="/submit?value={{ .ID }}">
          <div class="artist-img-wrapper">
            <img id="id{{ .ID }}" src="{{ .Image }}" alt="{{ .Name }}" loading="lazy" class="unselectable uninteractable">
          </div>
          <div class="artist-name">
            <h2>{{ .Name }}</h2>
          </div>
        </a>
      </article>
    {{ end }}
  </main>
 
<footer class="site-footer unselectable uninteractable">
  <p>&copy; 2025 Groupie Tracker &mdash; Crafted with passion</p>
</footer>
</body>
</html>
